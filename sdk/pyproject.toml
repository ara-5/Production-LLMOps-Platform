[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmops-sdk"
version = "0.1.0"
description = "Instrumentation SDK for the Production LLMOps Platform"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.69.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["llmops_sdk*"]
