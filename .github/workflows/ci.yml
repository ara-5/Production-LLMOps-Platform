name: CI

on:
  workflow_dispatch: {}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: llmops
          POSTGRES_PASSWORD: llmops
          POSTGRES_DB: llmops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llmops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://llmops:llmops@localhost:5432/llmops
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e ./sdk
          pip install pytest ruff

      - name: Lint
        run: ruff check backend sdk demo_app scripts

      - name: Run Alembic migration
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        run: pytest backend/tests sdk/tests -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Type-check
        run: npx tsc -b

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000
